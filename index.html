<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국책과제 & 입찰공고 실시간 모니터링 대시보드</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-dark: #0f766e;
      --primary-light: #ecfdf5;
      --accent-red: #ef4444;
      --accent-blue: #2563eb;
      --accent-purple: #8b5cf6;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 30px 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 15px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .header-title h1 { font-size: 24px; font-weight: 800; color: #1e293b; display: flex; align-items: center; gap: 10px; }
    .badge-live { font-size: 12px; background-color: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
    .header-title p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

    /* Quick Links to Key R&D Portals */
    .portal-shortcuts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .portal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      text-decoration: none;
      transition: all 0.2s;
    }
    .portal-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .filter-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-btn {
      background: #f1f5f9;
      border: 1px solid transparent;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #475569;
      cursor: pointer;
      font-weight: 500;
    }
    .tag-btn.active, .tag-btn:hover { background: var(--primary-light); color: #065f46; border-color: #a7f3d0; }
    .search-input { padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; outline: none; width: 260px; }

    .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: #f8fafc; padding: 14px 18px; color: #475569; font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 16px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover { background-color: #fbfcfe; }

    .badge-org { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: #f1f5f9; color: #334155; }
    .badge-category { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .cat-rd { background: #e0e7ff; color: #4338ca; }
    .cat-bid { background: #fef3c7; color: #b45309; }

    .title-cell { max-width: 450px; }
    .title-link { color: var(--text-main); text-decoration: none; font-weight: 600; display: block; margin-bottom: 4px; line-height: 1.4; }
    .title-link:hover { color: var(--primary-dark); text-decoration: underline; }
    .tags-list { font-size: 12px; color: var(--text-muted); }

    .dday-tag { font-weight: 800; padding: 4px 8px; border-radius: 6px; font-size: 12px; display: inline-block; text-align: center; }
    .dday-urgent { background: #fee2e2; color: #b91c1c; }
    .dday-normal { background: #fef3c7; color: #92400e; }
    .dday-safe { background: #ecfdf5; color: #065f46; }

    .btn-action {
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-action:hover { background: #10b981; color: #fff; border-color: #10b981; }
    
    .loading-state { text-align: center; padding: 50px 20px; color: var(--text-muted); font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-title">
      <h1>
        🚀 국가 R&D 과제 & 입찰 공고 모니터링
        <span class="badge-live">LIVE</span>
      </h1>
      <p>나라장터(G2B), IRIS, 국방조달, NTIS 등 주요 연구기관 공고 통합 연동</p>
    </div>
  </header>

  <!-- 주요 과제/입찰 포털 직통 링크 -->
  <div class="portal-shortcuts">
    <a href="https://www.iris.go.kr" target="_blank" class="portal-btn">🌐 범부처통합연구지원 (IRIS) ↗</a>
    <a href="https://www.g2b.go.kr" target="_blank" class="portal-btn">🏛️ 나라장터 (G2B) ↗</a>
    <a href="https://www.d2b.go.kr" target="_blank" class="portal-btn">🛡️ 국방전자조달 (D2B) ↗</a>
    <a href="https://www.ntis.go.kr" target="_blank" class="portal-btn">🔬 국가과학기술지식정보 (NTIS) ↗</a>
  </div>

  <div class="controls-bar">
    <div class="filter-tags">
      <button class="tag-btn active" onclick="filterTable('all', this)">전체 보기</button>
      <button class="tag-btn" onclick="filterTable('선행개발/AI', this)"># 선행개발/AI</button>
      <button class="tag-btn" onclick="filterTable('소부장/공정', this)"># 소부장/기구/장비</button>
      <button class="tag-btn" onclick="filterTable('용역/R&D', this)"># 용역/R&D</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="공고명, 수요기관 검색..." onkeyup="searchTable()">
  </div>

  <div class="table-container">
    <table id="announcementTable">
      <thead>
        <tr>
          <th>발주/관리기관</th>
          <th>공고명 & 핵심 기술분야</th>
          <th>총 예산/사업비</th>
          <th>접수 마감일</th>
          <th>원문 바로가기</th>
        </tr>
      </thead>
      <tbody id="tenderBody">
        <!-- 기존의 가짜 예시 데이터는 모두 삭제되었으며, 실제 동기화 데이터 또는 상태 메시지만 표시됩니다 -->
        <tr>
          <td colspan="5" class="loading-state">
            데이터 수집 파이프라인에서 최신 공고를 동기화하는 중입니다. (Actions 실행 후 자동 갱신)
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function filterTable(category, btn) {
    const buttons = document.querySelectorAll('.tag-btn');
    buttons.forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    const rows = document.querySelectorAll('#tenderBody tr');
    rows.forEach(row => {
      const rowCat = row.getAttribute('data-category');
      if (!rowCat || category === 'all' || rowCat === category) {
        row.style.display = '';
      } else {
        row.style.display = 'none';
      }
    });
  }

  function searchTable() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const rows = document.querySelectorAll('#tenderBody tr');
    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? '' : 'none';
    });
  }
</script>

</body>
</html>
